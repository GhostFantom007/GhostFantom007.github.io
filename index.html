<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Mobile games and apps by GhostFantom007.">
  <title>GhostFantom007 — Apps</title>
  <style>
    :root { color-scheme: dark; --ink:#f2f7ff; --muted:#b5c2d6; --cyan:#6ee7ff; --panel:#101a2c; --line:#263b5b; }
    * { box-sizing:border-box; } body { margin:0; font:16px/1.65 Inter, ui-sans-serif, system-ui, sans-serif; color:var(--ink); background:radial-gradient(circle at 20% 0,#173a58 0,transparent 38rem),#08111f; }
    main { max-width:850px; margin:0 auto; padding:56px 24px 80px; } header { border-bottom:1px solid var(--line); padding-bottom:28px; margin-bottom:36px; }
    .eyebrow { color:var(--cyan); font-weight:700; letter-spacing:.12em; text-transform:uppercase; font-size:.78rem; } h1 { margin:.25rem 0 .5rem; line-height:1.15; font-size:clamp(2rem,6vw,3.7rem); } h2 { margin:2.5rem 0 .6rem; font-size:1.35rem; color:#fff; } p, li { color:var(--muted); } a { color:var(--cyan); } .notice { background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:18px 20px; } footer { border-top:1px solid var(--line); margin-top:48px; padding-top:20px; color:var(--muted); font-size:.9rem; }
    .apps{list-style:none;padding:0;display:grid;gap:14px} .apps a.card{display:block;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px 20px;text-decoration:none} .apps b{color:#fff;font-size:1.15rem} nav a{margin-right:16px}
  </style>
</head>
<body>
  <main>
    <header>
      <div class="eyebrow">Developer</div>
      <h1>GhostFantom007</h1>
      <p>Mobile games and apps.</p>
    </header>
    <ul class="apps">
      <li><a class="card" href="/antysnake/"><b>AntiSnake</b><br><span style="color:var(--muted)">Arcade game for Android. Dodge the snakes, collect stars.</span></a></li>
    </ul>
  </main>
</body>
</html>
